# run_sequential_md.conf — sequencemd mode: raw .md prompt files executed verbatim
# Usage:
#   bash run_sweep.sh --sequencemd run_sequential_md.conf
#
# Each line = one agent dispatch, top-to-bottom.
# Format: [ROLE|]path/to/prompt.md   (ROLE optional: mechanical|standard|complex|critical)
# Blank lines and lines starting with '#' are ignored.
# All paths below are repo-relative. The 10 files live in
# private/design_documents/prompts/ (user note says design_documents/prompts/).
#
# Dependency-safe order: CONTRACTS is the keystone (all others import from it);
# SCORECARD before INTERVIEWER (deterministic scoring feeds the LLM policy);
# AAI_STREAM before TURNTAKING (socket/mic before the state machine);
# TURNTAKING + INTERVIEWER before UI; DEMOPROOF needs scoring+contracts;
# SUBMIT before PITCH (disclosure.md feeds the deck/Q&A).
#
# No ROLE prefix below -> driver defaults each step to "standard".
# Uncomment a prefix to pin a step to a different ladder role, e.g.:
#   critical|private/design_documents/prompts/PROMPT-DP-CONTRACTS.md

private/design_documents/prompts/PROMPT-DP-CONTRACTS.md
private/design_documents/prompts/PROMPT-DP-SCORECARD.md
private/design_documents/prompts/PROMPT-DP-AAI-STREAM.md
private/design_documents/prompts/PROMPT-DP-INTERVIEWER.md
private/design_documents/prompts/PROMPT-DP-TURNTAKING.md
private/design_documents/prompts/PROMPT-DP-UI.md
private/design_documents/prompts/PROMPT-DP-DEPLOY.md
private/design_documents/prompts/PROMPT-DP-DEMOPROOF.md
private/design_documents/prompts/PROMPT-DP-SUBMIT.md
private/design_documents/prompts/PROMPT-DP-PITCH.md
