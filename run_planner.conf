# run_planner.conf — planner mode: design plans -> prompts JSON (+ rewrites run_sequential.conf)
# Usage:
#   bash run_sweep.sh --planner run_planner.conf
#
# Format per line: MODULE_ID:path/to/design_plan.md[:OUT[:ROLE[:KILL_MODE]]]
#   MODULE_ID  [A-Za-z0-9_-]+, must match the module id that the planner writes into
#              prompts JSON and that run_sequential.conf expects
#   design_plan path to the chassis-format design plan (output of the sequencemd run)
#   OUT        optional prompts JSON output; if omitted defaults to .run_sweep/prompts_<MODULE>.json
#              (or $PLANNER_OUT_DIR/prompts_<MODULE>.json when --out-dir is given)
#   ROLE       optional module-level fallback role (per-step prompts[].role wins);
#              one of: mechanical|standard|complex|critical  (default: standard)
#   KILL_MODE  optional: budget|compact (default: budget)
#
# Blank lines and lines starting with '#' are ignored. Order is the implementation
# order the planner will rewrite into run_sequential.conf. Keep the same dependency-
# safe order as run_sequential_md.conf (CONTRACTS first, PITCH last).
#
# All design plans below are produced by:
#   bash run_sweep.sh --sequencemd run_sequential_md.conf
# and land in private/design_documents/design_plans/ per each PROMPT's S10 rule.
# OUT paths below are explicit for clarity (they match the planner's defaults).

# --- foundation ---
CONTRACTS:private/design_documents/design_plans/DP-CONTRACTS.md:.run_sweep/prompts_CONTRACTS.json:critical
SCORECARD:private/design_documents/design_plans/DP-SCORECARD.md:.run_sweep/prompts_SCORECARD.json:complex
AAI_STREAM:private/design_documents/design_plans/DP-AAI-STREAM.md:.run_sweep/prompts_AAI_STREAM.json:critical
INTERVIEWER:private/design_documents/design_plans/DP-INTERVIEWER.md:.run_sweep/prompts_INTERVIEWER.json:critical
TURNTAKING:private/design_documents/design_plans/DP-TURNTAKING.md:.run_sweep/prompts_TURNTAKING.json:complex
UI:private/design_documents/design_plans/DP-UI.md:.run_sweep/prompts_UI.json:complex
# --- platform + proof ---
DEPLOY:private/design_documents/design_plans/DP-DEPLOY.md:.run_sweep/prompts_DEPLOY.json:mechanical
DEMOPROOF:private/design_documents/design_plans/DP-DEMOPROOF.md:.run_sweep/prompts_DEMOPROOF.json:mechanical
SUBMIT:private/design_documents/design_plans/DP-SUBMIT.md:.run_sweep/prompts_SUBMIT.json:mechanical
PITCH:private/design_documents/design_plans/DP-PITCH.md:.run_sweep/prompts_PITCH.json:mechanical
